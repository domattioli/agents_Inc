[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-inc"
dynamic = ["version"]
description = "Governed multi-agent dispatch and verification layer"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-PolyForm-Small-Business-1.0.0-NoAI-Training"
license-files = ["LICENSE"]
authors = [{ name = "Dominik O. Mattioli" }]
keywords = [
    "claude-code",
    "codex",
    "multi-agent",
    "model-pooling",
    "delegation",
    "governance",
    "verification",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/domattioli/agents_Inc"
Repository = "https://github.com/domattioli/agents_Inc"
Issues = "https://github.com/domattioli/agents_Inc/issues"
Changelog = "https://github.com/domattioli/agents_Inc/blob/main/CHANGELOG.md"

[project.scripts]
agents-inc = "agents_inc.install.cli:main"

[tool.setuptools.dynamic]
version = { attr = "agents_inc.__version__" }

# An explicit list: `packages.find` cannot see a package mapped through package-dir,
# so the two data packages (skills and the schema doc) are named here (D55).
[tool.setuptools]
packages = [
  "agents_inc", "agents_inc.install", "agents_inc.adapters", "agents_inc.hosts",
  "workerbees", "agents_inc._skills", "agents_inc._docs",
]

[tool.setuptools.package-dir]
"agents_inc._skills" = "skills"
"agents_inc._docs" = "docs/governance"

# "*" applies to every listed package, so JSON files in any agents_inc subpackage
# ship too. The agents_inc line is kept explicit. The data packages carry only the
# two skills the installer bundles and the schema doc, never skill tests.
[tool.setuptools.package-data]
"*" = ["*.json"]
agents_inc = ["*.json"]
"agents_inc._skills" = ["workerbee/**/*", "codex-bridge/**/*"]
"agents_inc._docs" = ["SCHEMA-3NF.md"]

[tool.setuptools.exclude-package-data]
"agents_inc._skills" = ["*/tests/**", "*/mcp/tests/**", "*/scripts/demo/**"]
