<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #101827;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .game {
      width: min(90vw, 420px);
      padding: 28px;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      box-shadow: 0 20px 50px #0007;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    .legend {
      margin: 0 0 18px;
      color: #94a3b8;
    }
    #status {
      min-height: 1.5em;
      margin: 0 0 18px;
      font-size: 1.1rem;
      font-weight: 700;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      aspect-ratio: 1;
    }
    .cell {
      border: 0;
      border-radius: 12px;
      background: #334155;
      color: #f8fafc;
      font: 700 clamp(2.8rem, 15vw, 5rem)/1 system-ui, sans-serif;
      cursor: pointer;
      transition: transform .12s, background .2s, color .2s;
    }
    .cell:hover:not(:disabled) {
      background: #475569;
      transform: scale(1.03);
    }
    .cell:focus-visible {
      outline: 3px solid #38bdf8;
      outline-offset: 2px;
    }
    .cell:disabled { cursor: default; }
    .cell.x { color: #38bdf8; }
    .cell.o { color: #fb7185; }
    .cell.win {
      color: #102016;
      background: #4ade80;
      animation: pulse .65s infinite alternate;
    }
    #reset {
      width: 100%;
      margin-top: 20px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #38bdf8;
      color: #082f49;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    #reset:hover { background: #7dd3fc; }
    #reset:focus-visible {
      outline: 3px solid #f8fafc;
      outline-offset: 3px;
    }
    @keyframes pulse {
      to { transform: scale(.94); }
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Tic-Tac-Toe</h1>
    <p class="legend">You are X · Computer is O</p>
    <p id="status" role="status" aria-live="polite">Your turn</p>
    <div id="board" role="grid" aria-label="Tic-tac-toe board"></div>
    <button id="reset" type="button">Reset Game</button>
  </main>

  <script>
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const resetButton = document.getElementById("reset");

    const wins = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    let board;
    let gameOver;
    let computerTimer;

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell";
      cell.dataset.index = i;
      cell.setAttribute("role", "gridcell");
      cell.setAttribute("aria-label", `Empty cell ${i + 1}`);
      cell.addEventListener("click", humanMove);
      boardElement.appendChild(cell);
    }

    const cells = [...document.querySelectorAll(".cell")];

    function resetGame() {
      clearTimeout(computerTimer);
      board = Array(9).fill("");
      gameOver = false;
      statusElement.textContent = "Your turn";
      cells.forEach((cell, index) => {
        cell.textContent = "";
        cell.className = "cell";
        cell.disabled = false;
        cell.setAttribute("aria-label", `Empty cell ${index + 1}`);
      });
    }

    function humanMove(event) {
      const index = Number(event.currentTarget.dataset.index);
      if (gameOver || board[index]) return;

      placeMark(index, "X");
      const result = evaluate(board);

      if (result) {
        finish(result);
        return;
      }

      statusElement.textContent = "Computer is thinking…";
      setBoardDisabled(true);
      computerTimer = setTimeout(computerMove, 350);
    }

    function computerMove() {
      if (gameOver) return;
      const index = bestMove();
      placeMark(index, "O");

      const result = evaluate(board);
      if (result) {
        finish(result);
      } else {
        statusElement.textContent = "Your turn";
        setBoardDisabled(false);
      }
    }

    function placeMark(index, mark) {
      board[index] = mark;
      cells[index].textContent = mark;
      cells[index].classList.add(mark.toLowerCase());
      cells[index].disabled = true;
      cells[index].setAttribute("aria-label", `Cell ${index + 1}: ${mark}`);
    }

    function evaluate(state) {
      for (const line of wins) {
        const [a, b, c] = line;
        if (state[a] && state[a] === state[b] && state[a] === state[c]) {
          return { winner: state[a], line };
        }
      }
      return state.every(Boolean) ? { winner: null, line: [] } : null;
    }

    function finish(result) {
      gameOver = true;
      setBoardDisabled(true);

      if (result.winner) {
        result.line.forEach(index => cells[index].classList.add("win"));
        statusElement.textContent =
          result.winner === "X" ? "You win!" : "Computer wins!";
      } else {
        statusElement.textContent = "It's a draw!";
      }
    }

    function setBoardDisabled(disabled) {
      cells.forEach((cell, index) => {
        cell.disabled = disabled || Boolean(board[index]);
      });
    }

    function bestMove() {
      let bestScore = -Infinity;
      let move = -1;

      for (let i = 0; i < board.length; i++) {
        if (!board[i]) {
          board[i] = "O";
          const score = minimax(board, false);
          board[i] = "";
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move;
    }

    function minimax(state, maximizing) {
      const result = evaluate(state);
      if (result) {
        if (result.winner === "O") return 10;
        if (result.winner === "X") return -10;
        return 0;
      }

      if (maximizing) {
        let score = -Infinity;
        for (let i = 0; i < state.length; i++) {
          if (!state[i]) {
            state[i] = "O";
            score = Math.max(score, minimax(state, false));
            state[i] = "";
          }
        }
        return score;
      }

      let score = Infinity;
      for (let i = 0; i < state.length; i++) {
        if (!state[i]) {
          state[i] = "X";
          score = Math.min(score, minimax(state, true));
          state[i] = "";
        }
      }
      return score;
    }

    resetButton.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
