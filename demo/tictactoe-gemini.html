<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #38bdf8;
        }

        #status {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            height: 2rem;
            font-weight: 500;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background-color: #1e293b;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
        }

        .cell {
            aspect-ratio: 1;
            background-color: #334155;
            border: none;
            border-radius: 8px;
            font-size: 3rem;
            font-weight: bold;
            color: #f8fafc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, transform 0.1s;
        }

        .cell:hover:not(:disabled) {
            background-color: #475569;
        }

        .cell:active:not(:disabled) {
            transform: scale(0.95);
        }

        .cell.x {
            color: #38bdf8;
        }

        .cell.o {
            color: #f43f5e;
        }

        #reset {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        #reset:hover {
            background-color: #0ea5e9;
        }

        #reset:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        <div id="status">Your turn (X)</div>
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
        <button id="reset">Reset Game</button>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const cells = document.querySelectorAll('.cell');
        const statusElement = document.getElementById('status');
        const resetButton = document.getElementById('reset');

        let board = ['', '', '', '', '', '', '', '', ''];
        let isGameActive = true;
        let currentPlayer = 'X'; // X is Human, O is AI

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]              // Diagonals
        ];

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        resetButton.addEventListener('click', resetGame);

        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (board[clickedCellIndex] !== '' || !isGameActive || currentPlayer !== 'X') {
                return;
            }

            makeMove(clickedCellIndex, 'X');
            
            if (checkWin('X')) {
                endGame('You win!');
                return;
            }
            
            if (checkDraw()) {
                endGame("It's a draw!");
                return;
            }

            // AI Turn
            currentPlayer = 'O';
            statusElement.textContent = "Computer's turn (O)...";
            
            setTimeout(() => {
                if (!isGameActive) return;
                
                const aiMove = getBestMove();
                makeMove(aiMove, 'O');

                if (checkWin('O')) {
                    endGame('Computer wins!');
                    return;
                }
                
                if (checkDraw()) {
                    endGame("It's a draw!");
                    return;
                }

                currentPlayer = 'X';
                statusElement.textContent = "Your turn (X)";
            }, 400);
        }

        function makeMove(index, player) {
            board[index] = player;
            cells[index].textContent = player;
            cells[index].classList.add(player.toLowerCase());
            cells[index].disabled = true;
        }

        function checkWin(player) {
            return winningConditions.some(condition => {
                return condition.every(index => board[index] === player);
            });
        }

        function checkDraw() {
            return board.every(cell => cell !== '');
        }

        function endGame(message) {
            statusElement.textContent = message;
            isGameActive = false;
            cells.forEach(cell => cell.disabled = true);
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            isGameActive = true;
            currentPlayer = 'X';
            statusElement.textContent = "Your turn (X)";
            
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o');
                cell.disabled = false;
            });
        }

        // Minimax Algorithm for unbeatable AI
        function getBestMove() {
            let bestScore = -Infinity;
            let bestMove = null;

            for (let i = 0; i < board.length; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    let score = minimax(board, 0, false);
                    board[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            return bestMove;
        }

        function minimax(currentBoard, depth, isMaximizing) {
            if (checkWinCondition('O', currentBoard)) return 10 - depth;
            if (checkWinCondition('X', currentBoard)) return depth - 10;
            if (currentBoard.every(cell => cell !== '')) return 0;

            if (isMaximizing) {
                let maxScore = -Infinity;
                for (let i = 0; i < currentBoard.length; i++) {
                    if (currentBoard[i] === '') {
                        currentBoard[i] = 'O';
                        let score = minimax(currentBoard, depth + 1, false);
                        currentBoard[i] = '';
                        maxScore = Math.max(score, maxScore);
                    }
                }
                return maxScore;
            } else {
                let minScore = Infinity;
                for (let i = 0; i < currentBoard.length; i++) {
                    if (currentBoard[i] === '') {
                        currentBoard[i] = 'X';
                        let score = minimax(currentBoard, depth + 1, true);
                        currentBoard[i] = '';
                        minScore = Math.min(score, minScore);
                    }
                }
                return minScore;
            }
        }

        function checkWinCondition(player, currentBoard) {
            return winningConditions.some(condition => {
                return condition.every(index => currentBoard[index] === player);
            });
        }
    </script>
</body>
</html>
